<span
  class="pane-lang"
  [class.pane-lang--gutter]="gutter()"
  [class.pane-lang--vertical]="vertical()"
>
  <svg class="pane-lang__mark" viewBox="0 0 16 16" aria-hidden="true">
    @switch (type()) {
      @case ('html') {
        <rect width="16" height="16" rx="2" fill="#e34c26" />
        <path
          d="M10.4 3.1 6.2 12.9"
          fill="none"
          stroke="#fff"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      }
      @case ('css') {
        <rect width="16" height="16" rx="2" fill="#2965f1" />
        <path
          d="M8 2.8v10.4M3.4 5.2l9.2 5.6M12.6 5.2 3.4 10.8"
          fill="none"
          stroke="#fff"
          stroke-width="1.4"
          stroke-linecap="round"
        />
      }
      @case ('js') {
        <rect width="16" height="16" rx="2" fill="#f7df1e" />
        <path
          d="M6.3 4c-1.6.9-2.4 2.1-2.4 4s.8 3.1 2.4 4M9.7 4c1.6.9 2.4 2.1 2.4 4s-.8 3.1-2.4 4"
          fill="none"
          stroke="#323330"
          stroke-width="1.4"
          stroke-linecap="round"
        />
      }
    }
  </svg>
  <span class="pane-lang__name">{{ shortName() }}</span>
</span>
