@if (loading) {
  <div
    class="flex min-h-32 flex-col items-center justify-center gap-3 p-6 text-center text-dim"
    [class.flex-1]="spinnerOnly"
    role="status"
    aria-live="polite"
  >
    <mat-spinner [diameter]="spinnerOnly ? diameter : 32" aria-hidden="true"></mat-spinner>
    <p class="m-0" [class.sr-only]="spinnerOnly">{{ loadingText }}</p>
  </div>
} @else if (error) {
  <div
    class="flex min-h-32 flex-1 flex-col items-center justify-center gap-2 p-6 text-center text-dim"
    role="alert"
  >
    <mat-icon aria-hidden="true">{{ errorIcon }}</mat-icon>
    <p class="m-0">{{ error }}</p>
  </div>
} @else if (empty) {
  <div
    class="flex min-h-32 flex-1 flex-col items-center justify-center gap-2 p-6 text-center text-dim"
  >
    <mat-icon aria-hidden="true">{{ emptyIcon }}</mat-icon>
    <p class="m-0">{{ emptyText }}</p>
  </div>
} @else {
  <ng-content></ng-content>
}
