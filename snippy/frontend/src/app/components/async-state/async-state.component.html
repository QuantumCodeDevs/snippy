@if (loading) {
  <div
    class="flex flex-col items-center justify-center gap-2 p-6 text-center text-dim"
    [class.min-h-32]="spinnerOnly"
    [class.flex-1]="spinnerOnly"
  >
    @if (spinnerOnly) {
      <mat-spinner [diameter]="diameter"></mat-spinner>
    } @else {
      <p class="m-0">{{ loadingText }}</p>
    }
  </div>
} @else if (error) {
  <div
    class="flex min-h-32 flex-1 flex-col items-center justify-center gap-2 p-6 text-center text-dim"
  >
    <mat-icon>{{ errorIcon }}</mat-icon>
    <p class="m-0">{{ error }}</p>
  </div>
} @else if (empty) {
  <div
    class="flex min-h-32 flex-1 flex-col items-center justify-center gap-2 p-6 text-center text-dim"
  >
    <mat-icon>{{ emptyIcon }}</mat-icon>
    <p class="m-0">{{ emptyText }}</p>
  </div>
} @else {
  <ng-content></ng-content>
}
