server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        include /etc/nginx/nginx-app-headers.inc;
        try_files $uri @spa;
    }

    location @spa {
        include /etc/nginx/nginx-app-headers.inc;
        rewrite ^ /index.html break;
    }

    location /embed/ {
        include /etc/nginx/nginx-embed-headers.inc;
        try_files $uri @embed_spa;
    }

    location @embed_spa {
        include /etc/nginx/nginx-embed-headers.inc;
        rewrite ^ /index.html break;
    }

    # PocketBase all-in-one OAuth2 redirects the login popup to
    # /_/#/auth/oauth2-redirect-success (or -failure). Dev proxies /_/ to
    # PocketBase, whose page calls window.close(). Do not proxy the Admin UI
    # here. Serve the static close page for every /_/ request instead, or the
    # popup loads the Angular app and stays open.
    location ^~ /_/ {
        include /etc/nginx/nginx-security-headers.inc;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files /oauth2-popup-close.html =404;
    }

    location /api/ {
        client_max_body_size 6m;
        limit_req zone=pbapi burst=40 nodelay;
        # File responses must not be sniffed into an executable type (SVG, HTML).
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://pocketbase:8090;
        # PocketBase sends the OAuth popup to /_/#/auth/oauth2-redirect-success.
        # Dev proxies /_/ to PocketBase, which closes the window. Do not proxy
        # the Admin UI. Send the popup to the static close page instead.
        proxy_redirect '~*^(?:https?://[^/]+)?/?(?:\.\./)?_/#/auth/oauth2-redirect-(?:success|failure)$' /oauth2-popup-close.html;
        proxy_redirect default;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Admin UI stays on the PocketBase port bound to 127.0.0.1:8090.
}
