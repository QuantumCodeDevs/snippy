server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        include /etc/nginx/nginx-app-headers.inc;
        try_files $uri @spa;
    }

    location @spa {
        include /etc/nginx/nginx-app-headers.inc;
        rewrite ^ /index.html break;
    }

    location /embed/ {
        include /etc/nginx/nginx-embed-headers.inc;
        try_files $uri @embed_spa;
    }

    location @embed_spa {
        include /etc/nginx/nginx-embed-headers.inc;
        rewrite ^ /index.html break;
    }

    location /api/ {
        client_max_body_size 6m;
        limit_req zone=pbapi burst=40 nodelay;
        # File responses must not be sniffed into an executable type (SVG, HTML).
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Admin UI (/_/) is not proxied. Use the PocketBase port bound to 127.0.0.1:8090.
}
