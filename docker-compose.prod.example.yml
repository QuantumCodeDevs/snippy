# Production deployment example — pull pre-built images from Docker Hub.
# Built and published by GitHub Actions (.github/workflows/docker-image.yml).
# Use with Portainer or: docker compose -f docker-compose.prod.example.yml up -d
#
# PocketBase reads stack.env (Portainer). The frontend only gets SITE_URL,
# never admin / SMTP / OAuth secrets. It reaches PocketBase through its own
# nginx /api/ proxy, so it needs no PocketBase URL.

services:
  pocketbase:
    # One process. pb_data is SQLite plus files, so do not scale this service.
    image: slurrps/snippy-pocketbase:latest
    container_name: snippy-pocketbase
    env_file:
      - stack.env
    volumes:
      - pb_data:/pb_data
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    networks:
      - NPM

  frontend:
    image: slurrps/snippy-frontend:latest
    container_name: snippy-frontend
    environment:
      # Public origin for the robots.txt Sitemap line. Not a secret.
      SITE_URL: ${PB_APP_URL:-}
    ports:
      # Published on all interfaces so a reverse proxy or tunnel (NPM, Cloudflare
      # Tunnel) can reach it. Firewall this port so plain HTTP is not public.
      - "${FRONTEND_PORT:-4200}:8080"
    depends_on:
      - pocketbase
    restart: unless-stopped
    networks:
      - NPM

volumes:
  pb_data:

networks:
  NPM:
    external: true
